syntax = "proto3";

package gate;

import "google/protobuf/timestamp.proto";

option go_package = "services/gate/internal/pb";

service Gate {
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Button(ButtonRequest) returns (ButtonResponse) {}
}

service Notification {
  rpc List(NotificationListRequest) returns (NotificationListResponse) {}
  rpc Read(NotificationReadRequest) returns (NotificationReadResponse) {}
}

service Log {
  rpc Activity(ActivityRequest) returns (ActivityResponse) {}
}

message ErrorInfo {
  string code = 1;
  string text = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  ErrorInfo error = 1; 
  string token = 2;
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  ErrorInfo error = 1; 
}


message ButtonRequest {
  string token = 1;
  int64 duration = 2;
  int64 chance = 3;
}

message ButtonResponse {
  ErrorInfo error = 1; 
}

message NotificationData {
  string kind = 1;
  string level = 2;
  string title = 3;
  string body = 4;
  int64 id = 5;
  google.protobuf.Timestamp created = 6;
}

message NotificationListRequest {
  string token = 1;
}

message NotificationListResponse {
  ErrorInfo error = 1;
  repeated NotificationData list = 2;
}

message NotificationReadRequest {
  string token = 1;
  int64 id = 2;
  bool all = 3;
}

message NotificationReadResponse {
  ErrorInfo error = 1;
}

message ActivityRequest {
  string token = 1;
}

message ActivityResponse {
  ErrorInfo error = 1;
  int64 requestCount = 2;
  google.protobuf.Timestamp lastRequest = 3;
}