syntax = "proto3";

package auth;

option go_package = "internal/auth/authpb";

service Auth {
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

message ErrorInfo {
  bool has = 1;
  string code = 2;
  string text = 3;
}


message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  ErrorInfo error = 1; 
  string token = 2;
}


message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  ErrorInfo error = 1; 
}