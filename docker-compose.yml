version: "3.8"

services:
  gate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-gate
    restart: always
    ports:
      - 14281:14281
    command: "-h 0.0.0.0 -auth auth:50051"
    depends_on:
      - auth
      - kafka

  auth:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-auth
    restart: always
    command: "-h 0.0.0.0 -db-user auth_user -db-pass auth_pwd -db-addr mariadb:3306 -db-name auth_db"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    restart: always
    command: "--init-file /init.sql"
    environment:
      MARIADB_ROOT_PASSWORD: 12345
    volumes:
      - "./_build/mariadb:/var/lib/mysql"
      - "./deployments/maria-db-dev-init.sql:/init.sql"
    ports:
      - 13306:3306

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - "./_build/zookeeper/secrets:/etc/zookeeper/secrets"
      - "./_build/zookeeper/data:/var/lib/zookeeper/data"
      - "./_build/zookeeper/log:/var/lib/zookeeper/log"

  kafka:
    image: confluentinc/cp-kafka:latest
    restart: always
    depends_on:
      - zookeeper
    volumes:
      - "./_build/kafka/secrets:/etc/kafka/secrets"
      - "./_build/kafka/data:/var/lib/kafka/data"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
