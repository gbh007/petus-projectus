version: "3.8"

services:
  gate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-gate
    restart: always
    ports:
      - 14281:14281
    command: "-h 0.0.0.0 -auth auth:50051"

  auth:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-auth
    restart: always
    command: "-h 0.0.0.0 -db-user auth_user -db-pass auth_pwd -db-addr mariadb:3306 -db-name auth_db"

  mariadb:
    image: mariadb:11
    restart: always
    command: "--init-file /init.sql"
    environment:
      MARIADB_ROOT_PASSWORD: 12345
    volumes:
      - "./_build/mariadb:/var/lib/mysql"
      - "./deployments/maria-db-dev-init.sql:/init.sql"
    ports:
      - 13306:3306